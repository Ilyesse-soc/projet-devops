stages:
  - build
  - test
  - push
  - deploy

variables:
  NEXT_PUBLIC_API_URL: http://backend-node:3001

########################
# BUILD STAGE
########################

build:frontend:
  stage: build
  tags:
    - linux
    - docker
    - efrei_project
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/.next
      - frontend/node_modules
      - frontend/package.json
      - frontend/package-lock.json

build:dotnet:
  stage: build
  tags:
    - linux
    - docker
    - efrei_project
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd backend-dotnet
    - dotnet restore
    - dotnet build --configuration Release
  artifacts:
    paths:
      - backend-dotnet/bin
      - backend-dotnet/obj

build:springboot:
  stage: build
  tags:
    - linux
    - docker
    - efrei_project
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend-springboot
    - mvn clean package -DskipTests=false
  artifacts:
    paths:
      - backend-springboot/target

########################
# TEST STAGE
########################

test:frontend:
  stage: test
  tags:
    - linux
    - docker
    - efrei_project
  image: node:20
  script:
    - cd frontend
    - npm run lint

test:springboot:
  stage: test
  tags:
    - linux
    - docker
    - efrei_project
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend-springboot
    - mvn test

########################
# PUSH STAGE
########################

push:frontend:
  stage: push
  tags:
    - linux
    - docker
    - efrei_project
  image: docker:24.0.7
  services:
    - docker:dind
  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA

push:dotnet:
  stage: push
  tags:
    - linux
    - docker
    - efrei_project
  image: docker:24.0.7
  services:
    - docker:dind
  script:
    - cd backend-dotnet
    - docker build -t $CI_REGISTRY_IMAGE/backend-dotnet:$CI_COMMIT_SHA .
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend-dotnet:$CI_COMMIT_SHA

push:springboot:
  stage: push
  tags:
    - linux
    - docker
    - efrei_project
  image: docker:24.0.7
  services:
    - docker:dind
  script:
    - cd backend-springboot
    - docker build -t $CI_REGISTRY_IMAGE/backend-springboot:$CI_COMMIT_SHA .
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend-springboot:$CI_COMMIT_SHA

########################
# DEPLOY STAGE
########################

deploy:docker-compose:
  stage: deploy
  tags:
    - linux
    - docker
    - efrei_project
  image: docker:24.0.7
  services:
    - docker:dind
  script:
    - cd infra/docker-compose
    - docker compose -f docker-compose.dev.yml up -d
  when: manual
  environment:
    name: production

deploy:minikube:
  stage: deploy
  tags:
    - linux
    - docker
    - efrei_project
  image: bitnami/kubectl:latest
  script:
    - cd infra/k8s
    - kubectl apply -f .
  when: manual
  environment:
    name: minikube
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker build -t $CI_REGISTRY_IMAGE/backend-node:latest ./backend-node
    - docker build -t $CI_REGISTRY_IMAGE/backend-dotnet:latest ./backend-dotnet
    - docker build -t $CI_REGISTRY_IMAGE/backend-springboot:latest ./backend-springboot
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/backend-node:latest
    - docker push $CI_REGISTRY_IMAGE/backend-dotnet:latest
    - docker push $CI_REGISTRY_IMAGE/backend-springboot:latest

deploy-compose:
  stage: deploy
  script:
    - docker-compose -f infra/docker-compose/docker-compose.dev.yml up -d
  when: manual

deploy-k8s:
  stage: deploy
  script:
    - kubectl apply -f infra/k8s/
  when: manual
